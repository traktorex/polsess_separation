# SepFormer 2-Stage Hyperparameter Optimization
# Stage 2: Refined search on 8K samples
# Stage 1 produced no usable refinement signal, so this sweep was run with the
# Stage-1 ranges unchanged (see the note on the parameter block below).

program: train_sweep.py
method: bayes
metric:
  name: best_val_sisdr
  goal: maximize

early_terminate:
  type: hyperband
  min_iter: 15  # Stage 2 runs longer, allow more warmup
  s: 2

parameters:
  # Fixed parameters
  config:
    value: experiments/sepformer/3-hyperparamopt/sepformer_8000.yaml
  
  num_epochs:
    value: 80
  
  seed:
    values: [42]
  
  early_stopping_patience:
    value: 15
  
  # ========================================
  # SEARCH RANGES (unchanged from Stage 1)
  # ========================================
  # Stage 1 was uninformative — SepFormer overfits 2K samples and every run
  # finished below 0 dB — so there was nothing to narrow towards. Stage 2 was
  # therefore run with the Stage-1 ranges as-is; the move to 8K samples is what
  # resolved the overfitting.
  
  lr:
    distribution: log_uniform_values
    min: 5e-5
    max: 3e-3
  
  weight_decay:
    distribution: log_uniform_values
    min: 1e-6
    max: 1e-4
  
  grad_clip_norm:
    distribution: uniform
    min: 0.5
    max: 15.0
  
  lr_factor:
    distribution: uniform
    min: 0.3
    max: 0.95
    
  lr_patience:
    values: [1, 2, 3, 4]


project: polsess-thesis-experiments
name: sepformer-stage2-8k
