# SPMamba3 Reduced Configuration
# Mamba-3 twin of experiments/spmamba/spmamba_sb_reduced.yaml (4 layers / 192 /
# 2 heads / emb_ks=4) — the reduced arch the thesis SPMamba runs used. Use this
# for a matched-capacity SPMamba-vs-SPMamba3 comparison. Requires Mamba-3 (venv_mamba3).

data:
  dataset_type: polsess
  batch_size: 2
  num_workers: 1
  prefetch_factor: 1
  task: SB
  train_max_samples: 16000
  val_max_samples: null

model:
  model_type: spmamba3
  spmamba3:
    input_dim: 64     # Not used, kept for compatibility
    n_srcs: 2         # Will be set by task in config post_init
    n_fft: 256        # Paper uses 256
    stride: 64        # Paper uses 64
    window: "hann"
    n_layers: 4       # Reduced from 6
    lstm_hidden_units: 192  # Unused for Mamba-3 (kept for config symmetry)
    attn_n_head: 2    # Reduced from 4
    attn_approx_qk_dim: 256  # Reduced from 512
    emb_dim: 16
    emb_ks: 4         # -> in_channels = 64
    emb_hs: 1
    activation: "prelu"
    eps: 1.0e-5
    # Mamba-3 specific. Constraint: expand * emb_dim * emb_ks divisible by headdim.
    # Here 2 * 16 * 4 = 128, headdim 32 -> 4 heads.
    d_state: 64
    headdim: 32
    expand: 2

training:
  # Optimizer settings
  lr: 0.002
  weight_decay: 1.0e-5
  grad_clip_norm: 2.0  # More aggressive clipping

  # Learning rate scheduler (ReduceLROnPlateau from paper)
  lr_factor: 0.5
  lr_patience: 1

  # Training configuration
  num_epochs: 100
  use_amp: true

  # Checkpointing and logging
  save_dir: "checkpoints"
  use_wandb: true
  wandb_project: polsess-separation-real16k
  wandb_run_name: 16k_spmamba3_reduced_16k
  log_level: "INFO"

  save_all_checkpoints: false

  # Hardware
  device: "cuda"
  seed: 42
  resume_from: null

  # Validation and curriculum learning
  validation_variants: ["SER", "SE"]

  # Curriculum learning schedule
  curriculum_learning:
    - epoch: 1
      variants: ["R", "SR", "S", "SE", "ER", "E", "SER"]
      lr_scheduler: start
