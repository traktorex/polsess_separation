# SPMamba-reduced BASELINE config, flat/no-curriculum — 64k.
# Based on: 64k_spmamba_sb_reduced.yaml (as-run for l4pln536 / 87lepmzg, 6.28).
#
# THE LOAD-BEARING ARM of N2 as respecced under Decision A (see thesis ch5,
# 2026-08-10). Tabela 5.7 moves both SPMamba rows to the flat regime; the
# "po strojeniu" row then reads 5.94 / N1@16k / N1@32k / 8.04 (`7ifvwekd`,
# flat). Without a flat BASELINE at 64k the tuned-vs-bazowa comparison — the
# "+1,4 dB" claim — would pit a flat tuned run against a with-schedule
# baseline and be schedule-confounded. This run is that missing counterpart.
#
# TWO FIELDS DIFFER from the progressive baseline it derives from:
#   1. curriculum_learning collapses to the single all-variant stage (the old
#      stage-3 list, promoted to epoch 1);
#   2. the budget is 80 epochs + early_stopping_patience 15 (author ruling,
#      2026-08-10), matching the flat TUNED run this row is compared against
#      (7ifvwekd, 80/15) so the tuned-vs-bazowa pair is budget-matched as well
#      as schedule-matched. Patience is set explicitly because the dataclass
#      default is None, i.e. no early stopping at all — without it 80 epochs
#      would give the baseline a strictly LARGER budget than the tuned run.
# Optimizer recipe (lr 1e-3, wd 1e-5, clip 2.0, factor 0.5/patience 2), seed 42
# and the validation set are held identical to the progressive baseline.
#
# Consequence to keep in mind: at 80/15 this run is no longer budget-comparable
# to the 30-epoch progressive l4pln536/87lepmzg, so it does NOT cleanly isolate
# the schedule effect against them. Its intended comparison is the flat tuned
# run; the schedule effect itself is carried by the curriculum ablation
# (Tab 5.8/5.9), which uses its own matched pair.

data:
  dataset_type: polsess
  batch_size: 1
  num_workers: 1
  prefetch_factor: 2
  task: SB
  train_max_samples: 64000
  val_max_samples: null

model:
  model_type: spmamba
  spmamba:
    input_dim: 64  # Not used, kept for compatibility
    n_srcs: 2  # Will be set by task in config post_init
    n_fft: 256  # Paper uses 256
    stride: 64  # Paper uses 64
    window: "hann"
    n_layers: 4  # Reduced from 6 (saves ~33% memory)
    lstm_hidden_units: 192  # Reduced from 256 (saves ~25% memory)
    attn_n_head: 2  # Reduced from 4 (saves 50% attention memory)
    attn_approx_qk_dim: 256  # Reduced from 512 (saves 50% Q/K memory)
    emb_dim: 16  # Keep same
    emb_ks: 4
    emb_hs: 1  # Keep same
    activation: "prelu"
    eps: 1.0e-5

training:
  # Optimizer settings — identical to the progressive baseline
  lr: 0.001
  weight_decay: 1.0e-5  # Small value for stability
  grad_clip_norm: 2.0  # More aggressive clipping

  # Learning rate scheduler (ReduceLROnPlateau from paper)
  lr_factor: 0.5
  lr_patience: 2

  # Training configuration
  num_epochs: 80
  early_stopping_patience: 15
  use_amp: true

  # Checkpointing and logging
  save_dir: "checkpoints"
  use_wandb: true
  wandb_project: polsess-separation-64k
  # Distinct from the progressive baseline's `64k_baseline` (l4pln536 /
  # 87lepmzg): W&B display names collide across runs, and these
  # two runs are precisely the pair a reader must be able to tell apart.
  wandb_run_name: 64k_baseline_withoutcr
  wandb_entity: null
  log_file: null
  log_level: "INFO"

  # Hardware
  device: "cuda"
  seed: 42
  resume_from: null

  # Validation
  validation_variants: ["SER", "SE"]

  # Flat schedule: the progressive config's final stage, promoted to epoch 1.
  curriculum_learning:
    - epoch: 1
      variants: ["R", "SR", "S", "SE", "ER", "E", "SER"]
      lr_scheduler: start
