# SPMamba paper-full scaling run — 16k.   [full 6/256, emb_ks=8, paper optimizer]
#
# HEADER REWRITTEN 2026-07-29 to match what the file actually runs (the old header
# described the never-launched 128k_paper_final.yaml: all-8 validation, no curriculum,
# early-stop 20 — none of which is true of this body).
#
# PURPOSE: the capacity-attribution arm for the reduced-SPMamba saturation (ch5 §5.5).
# Paper ARCHITECTURE + OPTIMIZER (Adam lr 1e-3, wd 0, ReduceLROnPlateau 0.5/patience 2,
# clip 5.0 as harness constant); TRAINING HARNESS matched to the reduced config-1
# scaling runs — same 3-stage curriculum, same {SER,SE} validation (best_val_sisdr),
# early-stop 6 — so the full-vs-reduced overlay is direct: same metric, same curriculum
# family, same seed. NOT comparable to the 128k finals (all-8 SI-SDRi, different
# corpus + val set). config-1's hyperparameters were tuned for the reduced architecture
# (a different model) and are not transplanted onto the full one.
#
# As-run history: l2wdbeif (3080, killed ep8 — NB it pointed at the C_final_128_v2
# root, not C_new_64) and eaajo48k (4070, C_new_64, killed ep35 at 5.643 {SER,SE} val
# SI-SDR, still climbing — the resume candidate). Measured cost: 2.70 h/ep (4070),
# 2.97 h/ep (3080).

data:
  dataset_type: polsess
  batch_size: 1
  num_workers: 2
  prefetch_factor: 2
  task: SB
  train_max_samples: 16000

model:
  model_type: spmamba
  spmamba:
    input_dim: 64
    n_srcs: 2
    n_fft: 256
    stride: 64
    window: "hann"
    n_layers: 6              # FULL (reduced config-1 used 4)
    lstm_hidden_units: 256   # FULL (reduced used 192)
    attn_n_head: 4           # FULL (reduced used 2)
    attn_approx_qk_dim: 512  # FULL (reduced used 256)
    emb_dim: 16
    emb_ks: 8                # paper kernel (reduced runs used 4; see header)
    emb_hs: 1
    activation: "prelu"
    eps: 1.0e-5

training:
  # ---- Paper recipe (verbatim from 128k_paper_final / spmamba-wsj0.yml) ----
  seed: 42
  lr: 0.001                # Paper (Adam).
  weight_decay: 4.885301855720965e-06  
  lr_factor: 0.5           # Paper ReduceLROnPlateau factor.
  lr_patience: 1          # Paper ReduceLROnPlateau patience.
  grad_clip_norm: 5.0      # Harness: trainer always clips; paper yaml has none.
  num_epochs: 500          # Paper cap; early stopping ends it far sooner.
  early_stopping_patience: 6   # Paper.
  use_amp: true            # bf16 (validated safe/better) — set false for literal fp32.
  amp_eps: 0.0001
  save_dir: checkpoints
  save_all_checkpoints: false

  use_wandb: true
  wandb_project: polsess-separation-real16k
  wandb_run_name: 16k_spmamba_full_42_third_attempt
  log_level: INFO

  validation_variants: ["SER", "SE"]

  curriculum_learning:
    - epoch: 1
      variants: ["R", "SR", "S", "SE", "ER", "E", "SER"]
      lr_scheduler: start