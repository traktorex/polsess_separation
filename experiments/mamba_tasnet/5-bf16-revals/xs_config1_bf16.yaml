# MambaTasNet-XS — bf16 re-validation of HPO Config 1.
#
# Why this file exists: every Mamba run before 2026-04-19 silently trained and
# validated in fp16, because torch.compile's OptimizedModule wrapper defeated the
# class-name AMP dispatch (fixed in 2327c89; compile disabled for Mamba in c99b56c).
# This re-runs the winning XS validation config under the corrected bfloat16 path,
# so the XS numbers quoted in the thesis rest on a post-fix run. The config body is
# therefore deliberately identical to experiments/mamba_tasnet/5-hpo-xs-vals/
# validation_config1.yaml — only the training code changed, not the recipe.
#
# Source config: rosy-sweep-7 (71chyt2d), best_val_sisdr=4.126, sweep mamba-tasnet-xs (gbyurf31).
# Corpus: PolSESS_C_both (passed at launch with --data-root).
# As-run: W&B runs treasured-plasma-249 (seed 123), youthful-sun-250 (seed 456) and
# splendid-flower-251 (seed 42) on the RTX 4070, 2026-07-18..19, git ba9064a. Seeds were
# supplied on the command line (`--seed`), so the value below is only the default.
#
# Reconstructed from the checkpoint's config.yaml on 2026-09-03 (the file was used
# for training but never committed).

data:
  dataset_type: polsess
  batch_size: 8
  num_workers: 2
  prefetch_factor: 2
  task: SB
  train_max_samples: 16000

model:
  model_type: mamba_tasnet
  mamba_tasnet:
    N: 128
    kernel_size: 16
    stride: 8
    C: 2
    bot_dim: 128
    n_mamba: 16
    d_state: 16
    d_conv: 4
    expand: 2

training:
  seed: 42
  lr: 0.0016817982288650514
  weight_decay: 8.320231024740259e-07
  grad_clip_norm: 3.9832214176300873
  lr_factor: 0.6992033555931144
  lr_patience: 4
  num_epochs: 80
  use_amp: true
  amp_eps: 0.0001
  save_dir: checkpoints
  save_all_checkpoints: false
  early_stopping_patience: 15

  use_wandb: true
  wandb_project: polsess-separation
  log_level: INFO

  validation_variants: ["SER", "SE"]

  curriculum_learning:
    - epoch: 1
      variants: ["R", "S", "SR", "E", "ER", "SE", "SER"]
      lr_scheduler: start
