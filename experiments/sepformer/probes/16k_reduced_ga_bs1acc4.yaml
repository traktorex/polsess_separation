# N7 — Gradient-accumulation equivalence probe (bs1 x accum4 arm).
#
# WHY: the SepFormer 128k final (sepformer_128k_final_42) is the only thesis
# run that trained with gradient accumulation (bs1 x accum2), and the Rys 5.3
# caption states this fact. Nothing on this codebase validates empirically
# that bs_micro x accum_steps is equivalent to the same effective batch
# trained directly. This probe closes that gap cheaply.
#
# DESIGN: byte-identical to 5-scaling/16k_reduced.yaml (run ky8x5ukl, B1 in
# the ch5 grid, best {SER,SE} val 5.39) EXCEPT batch_size 4 -> 1 and
# grad_accumulation_steps 1 -> 4, so the effective batch (4), the number of
# optimizer steps per epoch (4000), the LR schedule, and the seed all match.
# With num_workers: 1 and the seeded sampler, the sample order AND the MM-IPC
# variant stream are identical to ky8x5ukl's by construction — the arms
# differ only in the accumulation mechanics (per-window loss division,
# GradScaler cadence) and the GPU they ran on.
#
# PASS BAR: final best within the SepFormer-64k three-seed spread (+-0.2 dB
# of 5.39) with a tracking val trajectory => one apparatus sentence in 5.1.3.
# A bigger deviation => run the contingent same-GPU bs4 control
# (16k_reduced_ga_ctrl_bs4.yaml) to split hardware from mechanism.
#
# LAUNCH (3080): pass --data-root explicitly — the 3080's POLSESS_DATA_ROOT
# points at PolSESS_C_final_128_v2 (the 8fi21rue corpus trap). Tripwires in
# the first log lines: Root: ...C_new_64, Train samples: 16000,
# Val samples: 400, and "Grad accumulation: 4 steps (effective batch=4)".

data:
  dataset_type: polsess
  batch_size: 1       # micro-batch; effective batch = 1 x 4 = ky8x5ukl's 4
  num_workers: 1
  prefetch_factor: 2
  task: SB
  train_max_samples: 16000

model:
  model_type: sepformer
  sepformer:
    N: 128          # Encoder channels      (full: 256)
    kernel_size: 16
    stride: 8
    C: 2            # Number of speakers
    causal: false
    num_blocks: 2   # Number of times to repeat SepFormer block (unchanged)
    num_layers: 6   # Transformer layers in both IntraT and InterT (full: 8)
    d_model: 128    # Transformer dimension (full: 256)
    nhead: 4        # Attention heads       (full: 8; head dim stays 32)
    d_ffn: 512      # Feed-forward dimension (full: 1024; stays 4 * d_model)
    dropout: 0.0
    chunk_size: 250 # Dual-path chunk size (unchanged — data-path, not capacity)
    hop_size: 125   # Unused by SpeechBrain's Dual_Path_Model; kept for config parity
    use_positional_encoding: True

training:
  # ---- Identical to 16k_reduced.yaml except grad_accumulation_steps ----
  seed: 42
  lr: 0.0003
  weight_decay: 0.0
  grad_clip_norm: 5.0
  grad_accumulation_steps: 4
  lr_factor: 0.5
  lr_patience: 2
  num_epochs: 200
  use_amp: true
  amp_eps: 0.0001
  save_dir: checkpoints
  save_all_checkpoints: false
  early_stopping_patience: 15

  use_wandb: true
  wandb_project: polsess-separation
  wandb_run_name: ga_probe_16k_sepreduced_bs1acc4
  log_level: INFO

  validation_variants: ["SER", "SE"]

  # No curriculum: all seven non-C variants from epoch 1 — matches ky8x5ukl.
  curriculum_learning:
    - epoch: 1
      variants: ["R", "S", "SR", "E", "ER", "SE", "SER"]
      lr_scheduler: start
