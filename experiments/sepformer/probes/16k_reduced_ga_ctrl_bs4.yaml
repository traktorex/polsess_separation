# N7 — Gradient-accumulation probe, CONTINGENT same-GPU control (bs4 arm).
#
# DO NOT LAUNCH by default. Run this ONLY if the probe arm
# (16k_reduced_ga_bs1acc4.yaml) deviates from ky8x5ukl (B1, 5.39) by more
# than the +-0.2 dB pass bar: it re-runs B1's exact config on the same GPU
# as the probe, splitting hardware/precision noise from the accumulation
# mechanics. Byte-identical to 5-scaling/16k_reduced.yaml except the W&B
# project/run-name (kept out of -real16k to avoid display-name collisions
# with the real grid cell).
#
# LAUNCH (3080): same --data-root warning and tripwires as the probe arm.
data:
  dataset_type: polsess
  batch_size: 4       # same as ky8x5ukl — this arm re-runs B1 on the probe GPU
  num_workers: 1
  prefetch_factor: 2
  task: SB
  train_max_samples: 16000

model:
  model_type: sepformer
  sepformer:
    N: 128          # Encoder channels      (full: 256)
    kernel_size: 16
    stride: 8
    C: 2            # Number of speakers
    causal: false
    num_blocks: 2   # Number of times to repeat SepFormer block (unchanged)
    num_layers: 6   # Transformer layers in both IntraT and InterT (full: 8)
    d_model: 128    # Transformer dimension (full: 256)
    nhead: 4        # Attention heads       (full: 8; head dim stays 32)
    d_ffn: 512      # Feed-forward dimension (full: 1024; stays 4 * d_model)
    dropout: 0.0
    chunk_size: 250 # Dual-path chunk size (unchanged — data-path, not capacity)
    hop_size: 125   # Unused by SpeechBrain's Dual_Path_Model; kept for config parity
    use_positional_encoding: True

training:
  # ---- Identical to 16k_reduced.yaml except grad_accumulation_steps ----
  seed: 42
  lr: 0.0003
  weight_decay: 0.0
  grad_clip_norm: 5.0
  lr_factor: 0.5
  lr_patience: 2
  num_epochs: 200
  use_amp: true
  amp_eps: 0.0001
  save_dir: checkpoints
  save_all_checkpoints: false
  early_stopping_patience: 15

  use_wandb: true
  wandb_project: polsess-separation
  wandb_run_name: ga_ctrl_16k_sepreduced_bs4
  log_level: INFO

  validation_variants: ["SER", "SE"]

  # No curriculum: all seven non-C variants from epoch 1 — matches ky8x5ukl.
  curriculum_learning:
    - epoch: 1
      variants: ["R", "S", "SR", "E", "ER", "SE", "SER"]
      lr_scheduler: start
