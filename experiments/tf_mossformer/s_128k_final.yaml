# TF-MossFormer S (D=96, B=4, H=256, ~5.92M) — 8 kHz PolSESS 128k FINAL training.
#
# WHY THIS EXISTS: the 128k-tier entry of TF-MossFormer S into the deployed-separator
# comparison, head-to-head with the MossFormer2-matched 128k final (run 6xuv1tob,
# 17.04 dB all-8 val SI-SDRi), the MF2 paper-full 128k final and the SepFormer 128k
# final (8q3yeeoz, 16.0 dB) — at ~1/4.5 of the matched model's parameters. Twin of
# `m_128k_final.yaml` (read that header for the protocol rationale); the S/M pair at
# 128k answers whether the capacity step still pays at the deployed data scale.
# Corpus: PolSESS_C_final_128_v2 (8 kHz render, 128,000 train rows, 1,000-item
# stratified val/) — point $POLSESS_DATA_ROOT (or --data-root) at the directory
# containing train/.
#
# Identical to `s_8k.yaml` (the 16k scaling row) EXCEPT:
#   - data: train_max_samples 16000 -> 128000, val_max_samples omitted (full val/).
#   - protocol: the final-training protocol shared by every other family's 128k
#     final (mossformer2/6-final-training/*, sepformer/6-final-training/128k_final.yaml,
#     spmamba/6-final-training/128k_full_final.yaml): NO curriculum (all 8 MM-IPC
#     variants incl. C from epoch 1) and per_variant_validation on all 8 variants,
#     best checkpoint / plateau scheduler / early stopping keyed on the all-8 avg
#     SI-SDRi. The 16k rows train on the 7 non-C variants and validate on {SER, SE}
#     only because they match the MossFormer2 16k rows; the finals are all-8.
#   - early_stopping_patience 10 -> 8: the project's LR-schedule rule (thesis/x_notes/
#     lr_schedule_analysis/FINDINGS.md, 2026-09-08) sets ES = 2*(lr_patience+1) = 8
#     for the paper's plateau patience 3. The paper's 10 is kept in s_8k.yaml.
#     Restore 10 for a literal paper recipe.
#   - W&B target: polsess-separation-128k / tf_mossformer_s_128k_final_42.
# Everything else (architecture verbatim from paper Table 1 S; AdamW + 4000-step
# linear warmup + wd 1e-2 + clip 5 + plateau factor 0.5 / patience 3; batch 2 with
# LR linearly rescaled 1e-3@bs4 -> 5e-4@bs2; bf16 AMP) is the paper recipe as argued
# in s_8k.yaml — the author rulings of 2026-09-07 (no gradient accumulation, linear
# LR-vs-batch scaling) apply unchanged. Warmup is a per-step quantity: 4000 optimizer
# steps = the first 1/16 of a 128k epoch at batch 2.
#
# ARCHITECTURE: paper Table 1, S column, verbatim. Measured 5,917,308 params (5.92M)
# against the paper's 6.0M table entry / 5.9M abstract — the paper's own row
# inconsistency (see s_8k.yaml / thesis/x_notes/tf_mossformer/tf_mossformer_spec.md §4).
#
# COST (extrapolated from WP4/WP5, RTX 4070 12 GB, bf16, compiled bs 2: 4.4 GiB,
#   ~207 ms/step; WP5 measured 4.6 batch/s = ~29 min per 16k epoch incl. validation):
#   64,000 steps/epoch -> ~3.7-3.9 h/epoch train-only, + all-8 validation of the
#   1,000-item val/ (8,000 forward passes, minutes) — on par with the matched-MF2 128k
#   final (3.4 h/epoch). If early stopping lands in the 60-80 epoch band
#   (matched-MF2 / SepFormer profile): ~10-13 days on one 4070. Eager (no compile,
#   361 ms/step) is ~6.4 h/epoch. The 3080 (10 GB) fits bs 2 too. Plan on --resume
#   across GPU reclaims (global_step is persisted, so the warmup and the epoch budget
#   survive; NB --resume ADDS num_epochs — see CLAUDE.md pitfall 5). Run only after
#   the S 16k row (16k_tf_mossformer_s_42) has cleared the decision gate (PLAN.md §WP5).

data:
  dataset_type: polsess
  batch_size: 2            # Paper's batch is 4; bs 4 does not fit 12 GB (author ruling 2026-09-07: no accumulation, use what fits).
  num_workers: 2           # IO knob only — nothing scientific depends on it.
  prefetch_factor: 2
  task: SB                 # Speaker separation (forces C=2).
  sample_rate: 8000        # PolSESS_C_final_128_v2 is an 8 kHz render; guard, not a resampler.
  train_max_samples: 128000
  # val_max_samples omitted -> full validation set (1,000 items x 8 variants).

model:
  model_type: tf_mossformer
  tf_mossformer:
    C: 2                   # Speakers (Config.__post_init__ forces this from task=SB).
    D: 96                  # Embedding dim (paper Table 1, S).
    num_blocks: 4          # B — each block is a frequency module + a temporal module.
    ffn_hidden_dim: 256    # H — Conv-SwiGLU hidden dim.
    conv_kernel_size: 4    # K — Conv1D/Deconv1D kernel inside Conv-SwiGLU.
    conv_stride: 1         # S — Conv-SwiGLU stride.
    n_heads: 4             # h — same head count for the local and the global attention.
    num_groups: 4          # RMSGroupNorm groups.
    window_t: 31           # w_T — local attention window on the frame axis.
    window_f: 7            # w_F — local attention window on the frequency axis.
    gate_kernel_size: 4    # Conv-Gate Conv1D kernel (Table 1's K, read literally).
    n_fft: 128             # 16 ms at 8 kHz -> F = 65 bins.
    hop_length: 64         # 8 ms at 8 kHz -> T = 501 frames for a 4.000 s clip.
    attn_dropout: 0.0      # Paper / upstream recipe: dropout 0.

training:
  # ---- Paper recipe (arXiv:2607.21128 §3.1 = TF-Locoformer's upstream WSJ0-2mix config) ----
  seed: 42
  optimizer: adamw         # NOT the project default Adam — the paper's optimiser.
  lr: 0.0005               # Paper: 1e-3 @ batch 4, linearly rescaled to batch 2 (project rule). Peak LR, reached at the end of warmup.
  warmup_steps: 4000       # Paper: linear warmup over the first 4000 optimizer steps (1/16 of a 128k epoch at bs 2).
  weight_decay: 0.01       # AdamW decoupled decay (the project's other configs use 0).
  grad_clip_norm: 5.0
  lr_factor: 0.5           # Halve on plateau.
  lr_patience: 1           # Paper plateau patience (kept; the other families' finals use 1 on their own recipes).
  num_epochs: 150          # Paper cap; early stopping governs.
  early_stopping_patience: 8   # 2*(lr_patience+1) per the LR-schedule rule; paper = 10 (see header).
  use_amp: true            # bf16 without GradScaler (trainer dispatches on model_type).
  save_dir: checkpoints
  save_all_checkpoints: false

  use_wandb: true
  wandb_project: polsess-separation-128k
  wandb_run_name: tf_mossformer_s_128k_final_42
  log_level: INFO

  # ---- Final-training protocol (all other families' 128k finals) ----
  # No curriculum: all 8 MM-IPC variants (incl. C) from epoch 1. Without a curriculum
  # the plateau scheduler is live from epoch 1 (warmup, per step, is independent of it).

  # Per-variant validation drives the LR scheduler, early stopping and the
  # best-checkpoint logic via avg SI-SDRi over all 8 MM-IPC variants.
  per_variant_validation: true
  validation_variants: null   # null = all 8 MM-IPC variants.
