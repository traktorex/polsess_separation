# MossFormer2 paper-depth (FULL, ~55.7M) scaling run — 32k.   [num_blocks=24]
#
# The whole 16k_full.yaml recipe scaled to 32k; see that file's header for the full
# rationale (de-confound the matched-depth ceiling; canonical SepFormer recipe, NOT the
# depth-11 sweep; all-8 final-training protocol on every point). Identical to 16k_full.yaml
# EXCEPT train_max_samples (32000) and the W&B target.
# Cost: ~2x matched per-epoch at this scale (ESTIMATE) — run after 16k.

data:
  dataset_type: polsess
  batch_size: 1            # ~55.7M model — one mixture per step (memory).
  num_workers: 1
  prefetch_factor: 2
  task: SB
  train_max_samples: 32000

model:
  model_type: mossformer2
  mossformer2:
    N: 512           # Encoder feature dim = transformer/GFSMN working dim.
    kernel_size: 16  # Encoder kernel (decoder stride = kernel_size // 2 = 8).
    C: 2
    num_blocks: 24   # PAPER-FULL GFSMN depth (matched curve used 11).
    attn_dropout: 0.1   # Upstream default, un-swept (matched sweep tuned 0.07; not transplanted).

training:
  # ---- Canonical SepFormer-baseline recipe (NOT the matched-128k sweep; see 16k header) ----
  seed: 42
  lr: 0.00015              # Canonical LR @ batch_size=1; matched used 3e-4 @ bs=2 (same lr/sample).
  weight_decay: 0.0
  grad_clip_norm: 5.0
  lr_factor: 0.5
  lr_patience: 1           # Final-training protocol (all-8 per-variant val is a stable signal).
  num_epochs: 100          # Cap; early stopping governs.
  early_stopping_patience: 8
  use_amp: true
  amp_eps: 0.0001
  save_dir: checkpoints
  save_all_checkpoints: false

  use_wandb: true
  wandb_project: polsess-separation-32k
  wandb_run_name: 32k_mossformer2_full_42
  log_level: INFO

  validation_variants: ["SER", "SE"]

  # Curriculum learning schedule (mirrors the SepFormer baseline)
  curriculum_learning:
    - epoch: 1
      variants: ["R", "S", "SR", "E", "ER", "SE", "SER"]
      lr_scheduler: start
