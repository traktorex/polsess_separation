[pytest]
testpaths = tests
addopts = -q
filterwarnings =
    # torchaudio -> TorchCodec migration deprecations (torchaudio 2.8, removal in 2.9);
    # third-party noise in any test doing real audio I/O. Revisit on the TorchCodec port.
    ignore:In 2.9, this function's implementation will be changed:UserWarning
    ignore:torio.io._streaming_media_decoder.StreamingMediaDecoder has been deprecated:UserWarning
    ignore:torio.io._streaming_media_encoder.StreamingMediaEncoder has been deprecated:UserWarning
    ignore:torchaudio.utils.download.download_asset has been deprecated:UserWarning
